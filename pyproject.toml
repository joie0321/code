[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vmware-migrate-deployable-product"
version = "0.1.0"
description = "Multi-source migration discovery collector and control-plane foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "boto3>=1.35,<2",
  "azure-identity>=1.17,<2",
  "azure-mgmt-resourcegraph>=8.0,<9",
  "azure-storage-blob>=12.24,<13",
  "pydantic-settings>=2.6,<3",
  "reportlab>=4.2,<5",
  "oci>=2.160,<3",
  "pyvmomi>=8.0,<10",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.39,<2",
  "XlsxWriter>=3.2,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["collector_agent*", "control_plane*"]

[tool.setuptools.package-data]
control_plane = ["migrations/*.ini", "migrations/*.mako"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
